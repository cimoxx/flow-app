<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow V20 - Správa Transakcií</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .category-btn.active {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        .dark .category-btn.active {
            border-color: #60a5fa;
            background-color: #1e3a8a;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen pb-12 transition-colors duration-200">

    <div class="max-w-xl mx-auto p-4 sm:p-6">
        
        <!-- Hlavička -->
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">Flow V20</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">Prehľad a správa transakcií</p>
            </div>
            <button id="themeToggle" class="p-2 rounded-lg bg-slate-200 dark:bg-slate-800 hover:opacity-80 transition">
                🌙
            </button>
        </header>

        <!-- Formulár na pridanie transakcie -->
        <section class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-700/60 mb-6">
            <h2 class="text-lg font-semibold mb-4">Nová transakcia</h2>
            <form id="transactionForm" class="space-y-4">
                
                <!-- Typ transakcie -->
                <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 dark:bg-slate-900 rounded-xl">
                    <button type="button" id="btnExpense" class="py-2 text-sm font-medium rounded-lg bg-white dark:bg-slate-800 shadow-sm text-red-600 dark:text-red-400">Výdavok</button>
                    <button type="button" id="btnIncome" class="py-2 text-sm font-medium rounded-lg text-slate-500 dark:text-slate-400">Príjem</button>
                </div>

                <!-- Suma a Dátum -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Suma (€)</label>
                        <input type="number" step="0.01" id="amount" required placeholder="0.00" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Dátum</label>
                        <input type="date" id="date" required class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <!-- Výber Kategórie -->
                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-2">Kategória</label>
                    <div id="categoriesContainer" class="grid grid-cols-4 gap-2">
                        <!-- Kategórie sa načítajú dynamicky -->
                    </div>
                </div>

                <!-- Poznámka -->
                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Poznámka (voliteľné)</label>
                    <input type="text" id="note" placeholder="Napr. Obed s kolegovcami" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl shadow-sm transition active:scale-[0.99]">
                    Pridať transakciu
                </button>
            </form>
        </section>

        <!-- Zoznam transakcií zoskupený podľa dní -->
        <section>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold">Prehľad transakcií</h2>
                <span id="totalCount" class="text-xs bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 px-2.5 py-1 rounded-full font-medium">0 transakcií</span>
            </div>

            <div id="groupedTransactionsList" class="space-y-6">
                <!-- Zoskupené transakcie sa vykreslia sem -->
            </div>
        </section>
    </div>

    <script>
        // --- 1. KATEGÓRIE (Zachované kompletne) ---
        const categories = [
            { id: 'food', name: 'Potraviny', icon: '🛒' },
            { id: 'restaurant', name: 'Reštaurácie', icon: '🍽️' },
            { id: 'housing', name: 'Bývanie', icon: '🏠' },
            { id: 'transport', name: 'Doprava', icon: '🚗' },
            { id: 'sports', name: 'Šport', icon: '⚽' },
            { id: 'entertainment', name: 'Zábava', icon: '🎬' },
            { id: 'health', name: 'Zdravie', icon: '💊' },
            { id: 'salary', name: 'Výplata', icon: '💰' },
            { id: 'other', name: 'Ostatné', icon: '📦' }
        ];

        // --- 2. STAV APLIKÁCIE ---
        let transactions = JSON.parse(localStorage.getItem('flow_transactions_v20')) || [];
        let selectedType = 'expense';
        let selectedCategory = categories[0].id;

        // --- 3. DOM ELEMENTY ---
        const transactionForm = document.getElementById('transactionForm');
        const amountInput = document.getElementById('amount');
        const dateInput = document.getElementById('date');
        const noteInput = document.getElementById('note');
        const categoriesContainer = document.getElementById('categoriesContainer');
        const groupedTransactionsList = document.getElementById('groupedTransactionsList');
        const btnExpense = document.getElementById('btnExpense');
        const btnIncome = document.getElementById('btnIncome');
        const totalCount = document.getElementById('totalCount');
        const themeToggle = document.getElementById('themeToggle');

        // Nastavenie dnešného dátumu do formulára
        dateInput.value = new Date().toISOString().split('T')[0];

        // --- 4. INICIALIZÁCIA A POMOCNÉ FUNKCIE ---
        function renderCategorySelector() {
            categoriesContainer.innerHTML = categories.map(cat => `
                <button type="button" data-id="${cat.id}" class="category-btn flex flex-col items-center justify-center p-2 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-blue-400 transition ${cat.id === selectedCategory ? 'active' : ''}">
                    <span class="text-xl mb-1">${cat.icon}</span>
                    <span class="text-[10px] font-medium truncate w-full text-center">${cat.name}</span>
                </button>
            `).join('');

            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    selectedCategory = btn.dataset.id;
                    renderCategorySelector();
                });
            });
        }

        // Pomocná funkcia pre hlavičku dňa (Dnes, Včera alebo formátovaný dátum)
        function formatDayHeader(dateStr) {
            const today = new Date().toISOString().split('T')[0];
            const yesterdayDate = new Date();
            yesterdayDate.setDate(yesterdayDate.getDate() - 1);
            const yesterday = yesterdayDate.toISOString().split('T')[0];

            if (dateStr === today) return 'Dnes';
            if (dateStr === yesterday) return 'Včera';

            const parts = dateStr.split('-');
            return `${parseInt(parts[2])}. ${parseInt(parts[1])}. ${parts[0]}`;
        }

        // --- 5. RENDER ZOSKUPENÝCH TRANSAKCIÍ ---
        function renderTransactions() {
            totalCount.textContent = `${transactions.length} transakcií`;

            if (transactions.length === 0) {
                groupedTransactionsList.innerHTML = `
                    <div class="text-center py-12 text-slate-400 dark:text-slate-500">
                        <p class="text-3xl mb-2">📥</p>
                        <p class="text-sm">Žiadne transakcie na zobrazenie</p>
                    </div>
                `;
                return;
            }

            // A) Zotriedenie transakcií podľa presného času zápisu (timestamp) DESC
            const sorted = [...transactions].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

            // B) Zoskupenie podľa dátumu (YYYY-MM-DD)
            const groups = {};
            sorted.forEach(t => {
                const dayKey = t.date; // Užívateľský dátum
                if (!groups[dayKey]) groups[dayKey] = [];
                groups[dayKey].push(t);
            });

            // C) Vykreslenie po dňoch
            groupedTransactionsList.innerHTML = Object.keys(groups).map(dayKey => {
                const dayTransactions = groups[dayKey];
                
                // Výpočet denného sumáru
                const dayTotal = dayTransactions.reduce((acc, t) => {
                    return t.type === 'income' ? acc + t.amount : acc - t.amount;
                }, 0);

                const formattedDayTotal = (dayTotal >= 0 ? '+' : '') + dayTotal.toFixed(2) + ' €';
                const dayTotalClass = dayTotal >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-600 dark:text-slate-400';

                return `
                    <div class="space-y-2">
                        <!-- Sticky Hlavička dňa -->
                        <div class="flex justify-between items-center px-1 text-xs font-semibold text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-800 pb-1">
                            <span>${formatDayHeader(dayKey)}</span>
                            <span class="${dayTotalClass}">${formattedDayTotal}</span>
                        </div>

                        <!-- Zoznam transakcií v danom dni -->
                        <div class="space-y-2">
                            ${dayTransactions.map(t => {
                                const cat = categories.find(c => c.id === t.categoryId) || categories[categories.length - 1];
                                const isIncome = t.type === 'income';
                                
                                return `
                                    <div class="flex items-center justify-between p-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-200/60 dark:border-slate-700/50 shadow-sm">
                                        <div class="flex items-center space-x-3">
                                            <div class="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-900 text-lg">
                                                ${cat.icon}
                                            </div>
                                            <div>
                                                <div class="text-sm font-medium leading-tight">${cat.name}</div>
                                                ${t.note ? `<div class="text-xs text-slate-400 dark:text-slate-500">${t.note}</div>` : ''}
                                            </div>
                                        </div>
                                        <div class="flex items-center space-x-3">
                                            <span class="text-sm font-semibold ${isIncome ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-800 dark:text-slate-100'}">
                                                ${isIncome ? '+' : '-'}${t.amount.toFixed(2)} €
                                            </span>
                                            <button onclick="deleteTransaction('${t.id}')" class="text-slate-300 hover:text-red-500 dark:text-slate-600 dark:hover:text-red-400 transition text-sm p-1">
                                                ✕
                                            </button>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- 6. EVENT LISTONERY A AKCIE ---

        // Prepínanie Typu (Výdavok / Príjem)
        btnExpense.addEventListener('click', () => {
            selectedType = 'expense';
            btnExpense.className = "py-2 text-sm font-medium rounded-lg bg-white dark:bg-slate-800 shadow-sm text-red-600 dark:text-red-400";
            btnIncome.className = "py-2 text-sm font-medium rounded-lg text-slate-500 dark:text-slate-400";
        });

        btnIncome.addEventListener('click', () => {
            selectedType = 'income';
            btnIncome.className = "py-2 text-sm font-medium rounded-lg bg-white dark:bg-slate-800 shadow-sm text-emerald-600 dark:text-emerald-400";
            btnExpense.className = "py-2 text-sm font-medium rounded-lg text-slate-500 dark:text-slate-400";
        });

        // Pridanie transakcie
        transactionForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const newTransaction = {
                id: Date.now().toString(),
                type: selectedType,
                amount: parseFloat(amountInput.value),
                date: dateInput.value,
                categoryId: selectedCategory,
                note: noteInput.value.trim(),
                createdAt: new Date().toISOString() // Presný čas zápisu na zoradenie
            };

            transactions.push(newTransaction);
            localStorage.setItem('flow_transactions_v20', JSON.stringify(transactions));

            // Reset formulára
            amountInput.value = '';
            noteInput.value = '';
            
            renderTransactions();
        });

        // Vymazanie transakcie
        window.deleteTransaction = function(id) {
            transactions = transactions.filter(t => t.id !== id);
            localStorage.setItem('flow_transactions_v20', JSON.stringify(transactions));
            renderTransactions();
        };

        // Dark Mode toggle
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // --- 7. ŠTART APLIKÁCIE ---
        renderCategorySelector();
        renderTransactions();
    </script>
</body>
</html>
