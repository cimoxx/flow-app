<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flow V20</title>
    <style>
        /* --- DESIGN SYSTEM & CSS VARIABLES --- */
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --border-color: #2a2a2a;
            --text-primary: #ffffff;
            --text-muted: #888888;
            --accent-blue: #3498db;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --accent-warning: #f39c12;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-main);
            padding: 16px;
            max-width: 480px;
            margin: 0 auto;
            padding-bottom: 90px;
        }

        /* --- MESAČNÝ BURN RATE CARD --- */
        .burn-rate-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .burn-rate-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .burn-rate-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .status-tag {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .status-good {
            background-color: rgba(46, 204, 113, 0.15);
            color: var(--accent-green);
        }

        .status-warning {
            background-color: rgba(231, 76, 60, 0.15);
            color: var(--accent-red);
        }

        .burn-rate-main {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 16px;
        }

        .burn-rate-value {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .burn-rate-subtext {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .burn-rate-progress-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-red));
            border-radius: 4px;
            transition: width 0.4s ease-out;
        }

        /* --- FORMULÁR TRANSAKCIÍ --- */
        .transaction-form {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        input, select {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-blue);
        }

        .btn-submit {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:active {
            opacity: 0.9;
        }

        /* --- UI NOTIFIKÁCIE & OFFLINE BADGE --- */
        .offline-badge {
            position: fixed;
            bottom: 24px;
            right: 16px;
            background-color: var(--accent-warning);
            color: #121212;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 8px 14px;
            border-radius: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            display: none;
            align-items: center;
            gap: 6px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        .toast-notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .toast-notification.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- TOAST NOTIFIKÁCIA -->
    <div id="toast" class="toast-notification"></div>

    <!-- OFFLINE UI BADGE -->
    <div id="offline-badge" class="offline-badge">⚡ 0 neodoslané</div>

    <!-- MESAČNÝ BURN RATE CARD -->
    <div class="burn-rate-card">
        <div class="burn-rate-header">
            <span class="burn-rate-title">Mesačný Burn Rate</span>
            <span id="burn-rate-status-tag" class="status-tag status-good">0.0% vs min. mesiac</span>
        </div>
        
        <div class="burn-rate-main">
            <div class="burn-rate-value" id="burn-rate-daily">0,00 €</div>
            <div class="burn-rate-subtext">priemer / deň</div>
        </div>

        <div class="burn-rate-progress-wrapper">
            <div class="progress-labels">
                <span id="burn-rate-current-total">Minuté: 0,00 €</span>
                <span id="burn-rate-pace-projected">Odhad: 0,00 €</span>
            </div>
            <div class="progress-bar-bg">
                <div id="burn-rate-progress-fill" class="progress-bar-fill" style="width: 0%;"></div>
            </div>
        </div>
    </div>

    <!-- TRANSAKČNÝ FORMULÁR -->
    <form id="transaction-form" class="transaction-form">
        <div class="form-group">
            <label for="amount">Suma (€)</label>
            <input type="number" id="amount" step="0.01" placeholder="0.00" required>
        </div>

        <div class="form-group">
            <label for="category">Kategória</label>
            <select id="category" required>
                <option value="Potraviny">Potraviny</option>
                <option value="Reštaurácie">Reštaurácie</option>
                <option value="Doprava">Doprava</option>
                <option value="Bývanie">Bývanie</option>
                <option value="Zábava">Zábava</option>
                <option value="Iné">Iné</option>
            </select>
        </div>

        <div class="form-group">
            <label for="user">Užívateľ</label>
            <select id="user" required>
                <option value="Lukáš">Lukáš</option>
                <option value="Zdenka">Zdenka</option>
            </select>
        </div>

        <div class="form-group">
            <label for="note">Poznámka</label>
            <input type="text" id="note" placeholder="Napr. Lidl nákup">
        </div>

        <button type="submit" class="btn-submit">Uložiť transakciu</button>
    </form>

    <script>
        // --- CONFIGURATION ---
        // Sem vlož svoju URL z Google Apps Script Web App
        const GOOGLE_SCRIPT_URL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';

        // Lokálna pamäť pre transakcie (pre výpočet Burn Rate)
        let localTransactions = JSON.parse(localStorage.getItem('flow_transactions') || '[]');

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            updateOfflineBadge();
            calculateAndRenderBurnRate(localTransactions);

            if (navigator.onLine) {
                syncOfflineQueue();
            }
        });

        // Sledovanie stavu siete
        window.addEventListener('online', () => {
            showToast('Pripojené k internetu. Synchronizujem...', 'info');
            syncOfflineQueue();
        });

        window.addEventListener('offline', () => {
            showToast('Aplikácia je offline. Dáta sa uložia lokálne.', 'warning');
            updateOfflineBadge();
        });

        // --- FORM SUBMIT HANDLING ---
        document.getElementById('transaction-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const transactionData = {
                id: Date.now(),
                date: new Date().toISOString(),
                amount: parseFloat(document.getElementById('amount').value),
                category: document.getElementById('category').value,
                user: document.getElementById('user').value,
                note: document.getElementById('note').value,
                type: 'expense'
            };

            // 1. Pridanie do lokálnej pamäte a prepočet Burn Rate
            localTransactions.push(transactionData);
            localStorage.setItem('flow_transactions', JSON.stringify(localTransactions));
            calculateAndRenderBurnRate(localTransactions);

            // 2. Uloženie cez Offline Queue / API
            await saveTransaction(transactionData);

            // 3. Reset formulára
            document.getElementById('transaction-form').reset();
        });

        // --- 1. OFFLINE QUEUE ENGINE ---
        async function saveTransaction(data) {
            if (!navigator.onLine) {
                queueOfflineTransaction(data);
                showToast('Uložené offline (čaká na sieť).');
                return;
            }

            try {
                await sendToGoogleSheets(data);
                showToast('Transakcia uložená!');
            } catch (error) {
                console.error('Chyba pri odosielaní:', error);
                queueOfflineTransaction(data);
                showToast('Chyba siete. Uložené do queue.');
            }
        }

        function queueOfflineTransaction(data) {
            const queue = JSON.parse(localStorage.getItem('flow_offline_queue') || '[]');
            queue.push({ ...data, queuedAt: new Date().toISOString() });
            localStorage.setItem('flow_offline_queue', JSON.stringify(queue));
            updateOfflineBadge();
        }

        async function syncOfflineQueue() {
            const queue = JSON.parse(localStorage.getItem('flow_offline_queue') || '[]');
            if (queue.length === 0) return;

            const remainingQueue = [];

            for (const item of queue) {
                try {
                    await sendToGoogleSheets(item);
                } catch (err) {
                    console.error('Sync zlyhal:', item, err);
                    remainingQueue.push(item);
                }
            }

            localStorage.setItem('flow_offline_queue', JSON.stringify(remainingQueue));
            updateOfflineBadge();

            if (remainingQueue.length === 0) {
                showToast('Offline dáta boli synchronizované!');
            }
        }

        async function sendToGoogleSheets(data) {
            // Ak nemáš nastavenú URL, simulujeme úspešné odoslanie
            if (GOOGLE_SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
                return new Promise(resolve => setTimeout(resolve, 500));
            }

            return fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
        }

        function updateOfflineBadge() {
            const queue = JSON.parse(localStorage.getItem('flow_offline_queue') || '[]');
            const badge = document.getElementById('offline-badge');
            
            if (queue.length > 0) {
                badge.innerHTML = `⚡ ${queue.length} neodoslané`;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
        }

        // --- 2. MESAČNÝ BURN RATE ENGINE ---
        function calculateAndRenderBurnRate(transactions) {
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth();
            const currentDay = now.getDate();
            const totalDaysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            // Akuálne výdavky tento mesiac
            const thisMonthExpenses = transactions.filter(t => {
                const d = new Date(t.date);
                return d.getFullYear() === currentYear && d.getMonth() === currentMonth && t.type === 'expense';
            });

            const currentTotalSpend = thisMonthExpenses.reduce((sum, t) => sum + parseFloat(t.amount || 0), 0);
            const dailyBurnRate = currentDay > 0 ? (currentTotalSpend / currentDay) : 0;
            const projectedTotalSpend = dailyBurnRate * totalDaysInMonth;

            // Výdavky minulý mesiac k rovnakému dňu
            const lastMonthDate = new Date(currentYear, currentMonth - 1, 1);
            const lastMonthYear = lastMonthDate.getFullYear();
            const lastMonth = lastMonthDate.getMonth();

            const lastMonthExpensesToSameDay = transactions.filter(t => {
                const d = new Date(t.date);
                return d.getFullYear() === lastMonthYear && 
                       d.getMonth() === lastMonth && 
                       d.getDate() <= currentDay && 
                       t.type === 'expense';
            });

            const lastMonthTotalToSameDay = lastMonthExpensesToSameDay.reduce((sum, t) => sum + parseFloat(t.amount || 0), 0);

            // Výpočet percentuálneho porovnania tempa
            let diffPercent = 0;
            if (lastMonthTotalToSameDay > 0) {
                diffPercent = ((currentTotalSpend - lastMonthTotalToSameDay) / lastMonthTotalToSameDay) * 100;
            }

            // Render do UI
            document.getElementById('burn-rate-daily').innerText = `${dailyBurnRate.toFixed(2)} €`;
            document.getElementById('burn-rate-current-total').innerText = `Minuté: ${currentTotalSpend.toFixed(2)} €`;
            document.getElementById('burn-rate-pace-projected').innerText = `Odhad: ${projectedTotalSpend.toFixed(2)} €`;

            // Progress Bar podľa pretečeného času v mesiaci
            const monthProgressPercent = Math.min((currentDay / totalDaysInMonth) * 100, 100);
            document.getElementById('burn-rate-progress-fill').style.width = `${monthProgressPercent}%`;

            // Status Tag
            const statusTag = document.getElementById('burn-rate-status-tag');
            if (diffPercent <= 0) {
                statusTag.className = 'status-tag status-good';
                statusTag.innerText = `${diffPercent.toFixed(1)}% vs min. mesiac`;
            } else {
                statusTag.className = 'status-tag status-warning';
                statusTag.innerText = `+${diffPercent.toFixed(1)}% vs min. mesiac`;
            }
        }

        // --- HELPER UNIFIED TOAST ---
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
